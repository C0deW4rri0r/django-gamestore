{% extends 'games/base.html' %}

{% block title %}Удаление{% endblock %}

{% block content %}
<div class="page-card page-card-narrow">
    <h1>Удаление игры</h1>

    <p>Вы уверены, что хотите удалить "{{ game.name }}"?</p>

    <form method="post" class="app-form">
        {% csrf_token %}

        <div class="form-actions">
            <button type="submit" class="btn danger">Да, удалить</button>
            <a href="{% url 'game_detail' game.pk %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
