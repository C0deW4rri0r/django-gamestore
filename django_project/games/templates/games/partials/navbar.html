<nav class="navbar">
    <div class="nav-container">
        <a href="{% url 'game_list' %}" class="logo">GameStore</a>

        <div class="nav-links">
            <a href="{% url 'game_list' %}">Игры</a>

            <a href="{% url 'cart_detail' %}" id="cart-link" class="cart-link">
                Корзина
                <span id="cart-counter" class="cart-counter">
                    {% if cart_items_count %}
                        {{ cart_items_count }}
                    {% else %}
                        0
                    {% endif %}
                </span>
            </a>

            {% if user.is_authenticated %}
                <a href="{% url 'game_create' %}" class="nav-accent-link">Добавить игру</a>
                <span class="nav-user">Привет, {{ user.username }}</span>

                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="nav-link-button">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-accent-link">Войти</a>
            {% endif %}
        </div>
    </div>
</nav>
