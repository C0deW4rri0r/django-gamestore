{% extends 'games/base.html' %}

{% block title %}Игры{% endblock %}

{% block content %}
    <h1>Список игр</h1>

    <div class="filters">
        <input type="text" id="search-input" placeholder="Поиск по названию...">

        <select id="genre-filter">
            <option value="">Все жанры</option>
            {% for genre in genres %}
                <option value="{{ genre.id }}">{{ genre.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div id="loading-indicator" class="hidden">
        Загрузка...
    </div>

    <div id="games-list-container" data-filter-url="{% url 'game_filter' %}">
        {% include 'games/partials/game_cards.html' %}
    </div>
    
{% endblock %}
